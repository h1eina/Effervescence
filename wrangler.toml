name = "marie-paul-site"
main = "worker.js"
compatibility_date = "2026-08-29"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "marie-paul-reflections"
database_id = "e1427833-df93-4732-b444-e8abe7655540"

[[routes]]
pattern = "mariepaul.ca/*"
zone_name = "mariepaul.ca"

[[routes]]
pattern = "www.mariepaul.ca/*"
zone_name = "mariepaul.ca"
